<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris</title>
    <link rel="stylesheet" href="../CSS/MainStyle.css">
</head>
<body>
    <div class="main_container">

        <div class="title">Tetris</div>

        <div class="content">

            <div id="game-board"></div>

            <div class="info">
                <div class="block_next_container">
                    <div class="block_next_text">Khối tiếp theo</div>
                    <div class="block_next_shape"></div>
                </div>
                <div class="score_container">
                    <div class="score_text">Score</div>
                    <div class="score">0</div>
                </div>
                <div class="level_container">
                    <div class="level_text">Level</div>
                    <div class="level">1</div>
                </div>
                <div class="play_again">
                    <button class="play_again_btn">Chơi lại</button>
                </div>
            </div>

            

        </div>

    </div>
    <script src="../SCRIPT/CreateGameBoard.js"></script>
</body>
</html>
